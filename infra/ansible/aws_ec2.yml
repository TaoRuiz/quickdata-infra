plugin: aws_ec2

regions:
  - eu-west-3

filters:
  instance-state-name: [ 'running' ]
keyed_groups:
  - key: tags.Role
    prefix: role
  - key: tags.RequireDocker
    prefix: require_docker
  - key: tags.WorkerType
    prefix: worker_type

hostnames:
  - tag:Name

compose:
  ansible_host: public_ip_address
  ansible_user: "ubuntu"